server:
  port: 8080
  servlet:
    context-path: /api
spring:
  application:
    name: cloud-picture-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cloud_picture
    username: root
    password: 123456
mybatis-plus:
  configuration:
    # MyBatis 配置
    map-underscore-to-camel-case: false
    #日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      #逻辑删除字段
      logic-delete-field: isDelete
      #删除
      logic-delete-value: 1
      #未删除
      logic-not-delete-value: 0
knife4j:
  enable: true
  openapi:
    title: yu-picture接口文档
    version: v4.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.rq.cloudpicturebackend.controller